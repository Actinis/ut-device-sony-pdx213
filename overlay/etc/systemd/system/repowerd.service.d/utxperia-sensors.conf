[Unit]
Wants=sensorfwd.service
After=sensorfwd.service

[Service]
# The first plugin load initializes HIDL after Android's asynchronous startup.
# Do this before repowerd's shorter DBus timeout can select NullLightSensor.
ExecStartPre=/usr/bin/gdbus call --system --timeout 60 --dest com.nokia.SensorService --object-path /SensorManager --method local.SensorManager.loadPlugin alssensor
