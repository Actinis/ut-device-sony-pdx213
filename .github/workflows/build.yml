name: Noble kernel and boot build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [pdx213-noble-port-v*]
    paths: [device/**, overlay/**, tools/**, sources.lock.json, .github/workflows/build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set build data directory
        run: echo "UT_PORTS_DATA_DIR=$RUNNER_TEMP/ut-ports-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and read source pins
        id: pins
        run: |
          python3 ci/check_repository.py
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          sources = json.loads(Path('sources.lock.json').read_text())['sources']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ['kernel', 'mkbootimg']:
                  output.write(f"{key}={sources[key]['commit']}\n")
          PYTHON
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Actinis/ut-kernel-sony-msm
          ref: ${{ steps.pins.outputs.kernel }}
          path: kernel
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LineageOS/android_system_tools_mkbootimg
          ref: ${{ steps.pins.outputs.mkbootimg }}
          path: mkbootimg
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc qemu-user unzip kmod
      - name: Verify and extract the locked NDK
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil, urllib.request
          from pathlib import Path
          data = Path(os.environ['UT_PORTS_DATA_DIR'])
          downloads = data / 'downloads'
          downloads.mkdir(parents=True)
          entry = json.loads(Path('sources.lock.json').read_text())['sources']['toolchain']
          archive = downloads / entry['filename']
          with urllib.request.urlopen(entry['url']) as source, archive.open('wb') as destination:
              shutil.copyfileobj(source, destination)
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == entry['sha256'], 'NDK checksum mismatch'
          PYTHON
          unzip -q "$UT_PORTS_DATA_DIR/downloads/android-ndk-r23b-linux.zip" -d "$UT_PORTS_DATA_DIR/toolchains"
      - name: Build kernel, DTBO, helpers and release boot
        run: |
          python3 tools/build.py --kernel-source "$GITHUB_WORKSPACE/kernel" \
            --mkbootimg-source "$GITHUB_WORKSPACE/mkbootimg" \
            --ndk "$UT_PORTS_DATA_DIR/toolchains/android-ndk-r23b" \
            --build-id "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --jobs 4 --fetch-inputs
      - name: Archive kernel and boot build results
        run: |
          build="$UT_PORTS_DATA_DIR/builds/pdx213/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -C "$build" -czf "$build/pdx213-noble-kernel-boot.tar.gz" out input-identity.json
      - name: Save kernel and boot build results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdx213-noble-kernel-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.UT_PORTS_DATA_DIR }}/builds/pdx213/ci-${{ github.run_id }}-${{ github.run_attempt }}/pdx213-noble-kernel-boot.tar.gz
            ${{ env.UT_PORTS_DATA_DIR }}/builds/pdx213/ci-${{ github.run_id }}-${{ github.run_attempt }}/out/build-report.json
            ${{ env.UT_PORTS_DATA_DIR }}/builds/pdx213/ci-${{ github.run_id }}-${{ github.run_attempt }}/input-identity.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Explain qualification boundary
        run: echo 'Kernel and boot built. No vendor/OEM, userdata, phone qualification, flash, OTA or release publication was performed.'
