name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate metadata
        run: python3 ci/check_repository.py
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Check shell scripts
        run: |
          command -v shellcheck
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          python3 - <<'PYTHON'
          import pathlib, py_compile
          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' not in path.parts:
                  py_compile.compile(str(path), doraise=True)
          PYTHON
      - name: Test release metadata
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          fi
      - name: Test call-audio route regression
        run: python3 tools/test_call_audio.py
