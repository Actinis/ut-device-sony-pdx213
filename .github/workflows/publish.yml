name: Publish Ubuntu Touch build
on:
  workflow_run:
    workflows: [Noble kernel and boot build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful kernel/boot workflow run ID to publish
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-pdx213
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Verify and publish the exact completed build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 tools/publish_ci_release.py --run-id "$SOURCE_RUN_ID"
